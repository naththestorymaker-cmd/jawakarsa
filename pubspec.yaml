name: jawakarsa
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  smooth_page_indicator: ^1.2.0+3
  google_fonts: ^6.2.1
  url_launcher: ^6.3.3
  firebase_core: 3.6.0
  firebase_auth: 5.3.1
  cloud_firestore: 5.4.4
  shared_preferences: ^2.3.5
  video_player: ^2.9.2
  just_audio: ^0.9.36

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/gendhis/
    - assets/carousel/
    - assets/fonts/
    - assets/images/header/

  fonts:
    - family: Hanacaraka
      fonts:
        - asset: assets/fonts/NotoSansJavanese-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansJavanese-Bold.ttf
          weight: 700
